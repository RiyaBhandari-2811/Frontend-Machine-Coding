<!DOCTYPE html>
<html lang="en">
<!--
  PROBLEM STATEMENT:
  ==================
  Build a Timer application that counts DOWN from a set time:
  
  REQUIREMENTS:
  1. Display time in MM:SS:MS format (minutes:seconds:milliseconds)
  2. INPUT field to set initial time (in seconds)
  3. START button: Begin counting down
  4. PAUSE button: Pause without resetting
  5. RESET button: Reset to original time
  6. Proper setInterval cleanup to prevent memory leaks
  7. Alert when timer reaches 0
  
  ACCEPTANCE CRITERIA:
  - User can set custom time
  - Time decrements continuously when START is clicked
  - PAUSE stops the timer but preserves the current value
  - RESET reverts to the originally set time
  - Only one interval should run at a time
  - Alert triggers when countdown reaches 0
  - UI updates smoothly
-->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            font-family: 'Arial', sans-serif;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            min-width: 400px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
        }

        input[type="number"] {
            padding: 10px 15px;
            font-size: 1em;
            border: 2px solid #ddd;
            border-radius: 8px;
            width: 150px;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #f5576c;
        }

        .input-group button {
            padding: 10px 20px;
            font-size: 1em;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #667eea;
            color: white;
            transition: all 0.3s ease;
        }

        .input-group button:hover {
            background-color: #5568d3;
            transform: translateY(-2px);
        }

        .timer-display {
            font-size: 4em;
            font-weight: bold;
            color: #f5576c;
            margin: 40px 0;
            font-family: 'Courier New', monospace;
            letter-spacing: 5px;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        button {
            padding: 15px 30px;
            font-size: 1.1em;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 110px;
        }

        #start {
            background-color: #4CAF50;
            color: white;
        }

        #start:hover {
            background-color: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }

        #pause {
            background-color: #ff9800;
            color: white;
        }

        #pause:hover {
            background-color: #e68900;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 152, 0, 0.4);
        }

        #reset {
            background-color: #f44336;
            color: white;
        }

        #reset:hover {
            background-color: #da190b;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(244, 67, 54, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .time-input {
            font-size: 0.9em;
            color: #666;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>⏲️ Timer</h1>
        
        <div class="input-group">
            <input type="number" id="time-input" placeholder="Seconds" min="1" value="60">
            <button onclick="setTimerTime()">Set Time</button>
        </div>

        <div class="timer-display" id="timer-display">01:00:00</div>
        
        <div class="time-input">
            <small>Enter seconds and click "Set Time", then Start</small>
        </div>

        <div class="button-group">
            <button id="start">Start</button>
            <button id="pause">Pause</button>
            <button id="reset">Reset</button>
        </div>
    </div>

    <script>
        // ============================================================
        // TIMER IMPLEMENTATION - Counts DOWN from set time
        // ============================================================

        const display = document.getElementById("timer-display");
        const timeInput = document.getElementById("time-input");
        const startBtn = document.getElementById("start");
        const pauseBtn = document.getElementById("pause");
        const resetBtn = document.getElementById("reset");

        let totalTime = 60; // Initial time in seconds
        let remainingTime = 60; // in seconds
        let intervalId = null;
        let isRunning = false;

        // Format time as MM:SS:MS
        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            const ms = Math.floor((seconds % 1) * 100);

            return `${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}:${String(ms).padStart(2, '0')}`;
        }

        // Set the timer time
        function setTimerTime() {
            const inputValue = parseInt(timeInput.value);
            
            if (isNaN(inputValue) || inputValue <= 0) {
                alert("Please enter a valid number of seconds");
                return;
            }

            pauseTimer(); // Stop current timer if running
            totalTime = inputValue;
            remainingTime = inputValue;
            display.innerHTML = formatTime(remainingTime);
        }

        // Start the timer
        function startTimer() {
            if (isRunning) return; // Prevent multiple intervals

            if (remainingTime <= 0) {
                alert("Timer is already complete!");
                return;
            }

            isRunning = true;
            const startTime = Date.now();
            const initialRemaining = remainingTime;

            intervalId = setInterval(() => {
                const elapsed = (Date.now() - startTime) / 1000;
                remainingTime = initialRemaining - elapsed;

                if (remainingTime <= 0) {
                    remainingTime = 0;
                    display.innerHTML = formatTime(0);
                    clearInterval(intervalId);
                    intervalId = null;
                    isRunning = false;
                    alert("⏲️ Timer Complete!");
                } else {
                    display.innerHTML = formatTime(remainingTime);
                }
            }, 10); // Update every 10ms for smooth animation
        }

        // Pause the timer
        function pauseTimer() {
            if (intervalId !== null) {
                clearInterval(intervalId);
                intervalId = null;
                isRunning = false;
            }
        }

        // Reset the timer
        function resetTimer() {
            clearInterval(intervalId);
            intervalId = null;
            remainingTime = totalTime;
            isRunning = false;
            display.innerHTML = formatTime(remainingTime);
        }

        // Event listeners
        startBtn.addEventListener("click", startTimer);
        pauseBtn.addEventListener("click", pauseTimer);
        resetBtn.addEventListener("click", resetTimer);

        // Initialize display
        display.innerHTML = formatTime(remainingTime);
    </script>
</body>

</html>
